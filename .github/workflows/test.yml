name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (FSM + Core + HUD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Babashka
        uses: DeLaGuardo/setup-clojure@13.3
        with:
          bb: latest

      - name: Run FSM tests
        run: bb test/fsm_test.clj

      - name: Run core key processing tests
        run: bb test/core_test.clj

      - name: Run HUD poller tests
        run: bb test/hud_test.clj

      - name: Run edit-with-emacs tests
        run: bb test/emacs_test.clj

      - name: Run autostart task tests
        run: bb test/autostart_test.clj

  elisp-tests:
    name: Elisp tests (tecla.el)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox

      - name: Install Buttercup
        run: make deps

      - name: Run Buttercup tests
        run: make test

  bridge-tests:
    name: Bridge integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevdev-dev pkg-config build-essential

      - name: Load uinput module
        run: sudo modprobe uinput

      - name: Install Babashka
        uses: DeLaGuardo/setup-clojure@13.3
        with:
          bb: latest

      - name: Build bridge
        run: |
          make -C bridge
          chmod +x bridge/tecla-bridge bridge/tecla-test-kbd bridge/tecla-test-monitor

      - name: Run integration tests
        run: sudo $(which bb) test/bridge_test.clj
